import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def releaseKeystoreProperties = new Properties()
def releaseKeystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = releaseKeystorePropertiesFile.exists()

if (hasReleaseKeystore) {
    releaseKeystorePropertiesFile.withInputStream { releaseKeystoreProperties.load(it) }
}

def androidVersionCode = (System.getenv('PETMANAGER_ANDROID_VERSION_CODE') ?: '1') as Integer
def androidVersionName = System.getenv('PETMANAGER_ANDROID_VERSION_NAME') ?: '1.0'
def generatedCapacitorConfig = file('src/main/assets/capacitor.config.json')

tasks.register('verifyReleaseServerUrl') {
    group = 'verification'
    description = 'Fails closed when an Android release has no production HTTPS Capacitor server URL.'

    doLast {
        if (!generatedCapacitorConfig.exists()) {
            throw new GradleException("Release Capacitor configuration is missing. Run the approved release sync first.")
        }

        def config = new JsonSlurper().parse(generatedCapacitorConfig)
        def serverUrl = config?.server?.url?.toString()?.trim()
        if (!serverUrl) {
            throw new GradleException("Release Capacitor server.url is missing. Refusing to package the offline placeholder.")
        }

        URI parsedServerUrl
        try {
            parsedServerUrl = new URI(serverUrl)
        } catch (Exception ignored) {
            throw new GradleException("Release Capacitor server.url is not a valid URL.")
        }

        def hostname = parsedServerUrl.host?.toLowerCase()
        if (
            parsedServerUrl.scheme?.toLowerCase() != 'https' ||
            !hostname ||
            hostname == 'localhost' ||
            hostname == '127.0.0.1' ||
            parsedServerUrl.port == 3000 ||
            parsedServerUrl.port == 3100
        ) {
            throw new GradleException("Release Capacitor server.url must use a production HTTPS endpoint.")
        }
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild') {
        dependsOn tasks.named('verifyReleaseServerUrl')
    }
}

android {
    namespace = "kr.petmanager.owner"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "kr.petmanager.owner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersionCode
        versionName androidVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(releaseKeystoreProperties['storeFile'])
                storePassword releaseKeystoreProperties['storePassword']
                keyAlias releaseKeystoreProperties['keyAlias']
                keyPassword releaseKeystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
