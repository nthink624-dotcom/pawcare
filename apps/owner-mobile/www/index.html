<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>넘친데이 펫매니저</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">PETMANAGER OWNER</p>
        <h1>오너 앱 준비 중</h1>
        <p class="body">
          아직 <code>OWNER_MOBILE_WEB_URL</code>이 설정되지 않아 로컬 안내 화면을 표시하고 있습니다.
        </p>
        <ol class="steps">
          <li><code>apps/owner-mobile/.env</code> 파일을 만들고 <code>OWNER_MOBILE_WEB_URL</code>을 설정합니다.</li>
          <li>운영 앱은 <code>https://app.petmanager.co.kr/owner/mobile</code>만 사용합니다.</li>
          <li><code>npm install</code> 후 <code>npm run sync</code>를 실행합니다.</li>
        </ol>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
